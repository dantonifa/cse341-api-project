<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <!-- Custom Responsive Styles to make the layout fit perfectly on any screen device -->
    <style>
        html, body {
        max-height: 100vh;
        overflow-y: auto; /* Adds a clean scrollbar only if the screen is extremely small */
        }
        
        main {
        padding: 2rem 1rem !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 90vh;
        }

        h1 {
        font-size: clamp(2rem, 5vw, 4rem) !important; /* Dynamically shrinks text on smaller screens */
        line-height: 1.1 !important;
        margin-bottom: 0.5rem !important;
        }

        .graphic-container, .graphic {
        max-width: clamp(150px, 25vw, 300px) !important; /* Automatically resizes the pyramid */
        margin: 0 auto !important;
        }

        img {
        max-width: 100% !important;
        height: auto !important;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="content">
            <div class="about">
                <h1>
                    <div class="proName" id="professionalName"></div>
                    <div class="stage">
                        <div class="pyramid3d">
                            <div class="triangle side1"></div>
                            <div class="triangle side2"></div>
                            <div class="triangle side3"></div>
                            <div class="triangle side4"></div>
                        </div>
                    </div>
                </h1>
                <div class="flex-container">
                    <div class="flex-child">
                        <img src="" alt="" id="professionalImage">
                    </div>
                    <div class="flex-child">
                        <h3>
                            <a href="" target="_blank" id="nameLink"></a><span id="primaryDescription"></span>
                        </h3>

                    </div>
                </div>
                <p class='pleft' id="workDescription1"></p>
                <p class='pright' id="workDescription2"></p>
                <h3 id="linkTitleText"></h3>
                <ul>
                    <li><a href="" target="_blank" id="linkedInLink"></a></li>
                    <li><a href="" target="_blank" id="githubLink"></a></li>
                </ul>
                <p id="contactText"></p>
            </div>
        </div>
    </div>
    <!-- Ultra-Wide Optimization: Linear Text Spanning -->
    <style>
        /* Forces your main header name onto a single horizontal line */
        h1 {
        white-space: nowrap !important;
        font-size: clamp(2.5rem, 4vw, 3.8rem) !important;
        margin-bottom: 0.5rem !important;
        }

        /* Target the text block wrapper and force it into one clean horizontal line */
        main div, main p, #primaryDesc, .primary-description {
        display: inline !important;
        white-space: nowrap !important;
        font-size: clamp(1.4rem, 2vw, 2.2rem) !important;
        }

        /* Add a small space right after your name so the text doesn't stick together */
        main h1 + div, main h1 + p {
        margin-top: 1rem !important;
        margin-bottom: 1.5rem !important;
        display: block !important;
        }

        /* Shifts the lower paragraphs and hyperlinks upward into the main view */
        main, #wrapper, .container {
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        }

        /* Keeps the central pyramid compact so it sits perfectly between lines */
        .graphic, #imgCorner, .graphic img {
        max-width: 160px !important;
        height: auto !important;
        margin: 0.5rem auto !important;
        }
    </style>

</body>

</html>
